<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestação de Contas da Sr Cotides</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>Prestação de Contas da Sr Cotides</h1>
</header>

<div class="cards">
    <div class="card">
        <h3>Saldo</h3>
        <p id="saldo">R$ 1500,00</p>
    </div>

    <div class="card">
        <h3>Total Gasto</h3>
        <p id="total">R$ 300,00</p>
    </div>

    <div class="card">
        <h3>Compras</h3>
        <p id="quantidade">2</p>
    </div>
</div>

<h2>Compras Recentes</h2>

<table>
<thead>
<tr>
<th>Estabelecimento</th>
<th>Valor</th>
<th>Data</th>
</tr>
</thead>

<tbody id="tabelaCompras">
</tbody>
</table>

<script src="app.js"></script>

</body>
</html>
